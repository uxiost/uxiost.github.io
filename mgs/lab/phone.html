<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratorio — móvil simulado</title>
  <style>
    html, body { margin: 0; background: #000; color: #ccc; font: 14px system-ui, sans-serif; }
    #src { width: 100%; max-width: 540px; display: block; }
    #out { padding: 8px; white-space: pre-wrap; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <!-- Fuente sintética con la misma forma que el lienzo del emulador en el móvil
       (1080×810 a 60 fps), con movimiento, ruido y una marca de tiempo codificada
       en la propia imagen para medir el retraso real extremo a extremo. -->
  <canvas id="src" width="1080" height="810"></canvas>
  <div id="out">Uso: lab/phone.html#CODIGO_TELE</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <script type="module">
    import { installAudioTap, streamTo, tuneStream, getAudioTrack } from "../js/stream.js";
    import { startNative } from "../js/native.js";
    import { PEER_PREFIX, randomCode } from "../js/protocol.js";
    import { stampTime } from "./stamp.js";

    installAudioTap();
    // ?lines=720&fps=30&kbps=2500 para probar variantes
    const qp = new URLSearchParams(location.search);
    tuneStream({ lines: +qp.get("lines") || 0, fps: +qp.get("fps") || 0, kbps: +qp.get("kbps") || 0 });
    const tvCode = location.hash.slice(1);
    const c = document.getElementById("src");
    const g = c.getContext("2d");
    let frame = 0;
    function draw() {
      frame++;
      // Fondo con degradado móvil y "sprites" que cruzan la pantalla (como un juego).
      const t = performance.now() / 1000;
      const grd = g.createLinearGradient(0, 0, 1080, 810);
      grd.addColorStop(0, `hsl(${(t * 40) % 360},50%,20%)`);
      grd.addColorStop(1, `hsl(${(t * 40 + 120) % 360},50%,35%)`);
      g.fillStyle = grd;
      g.fillRect(0, 0, 1080, 810);
      for (let i = 0; i < 24; i++) {
        const x = (i * 97 + t * (60 + i * 13)) % 1180 - 50;
        const y = 120 + (i * 61) % 640;
        g.fillStyle = `hsl(${i * 15},80%,60%)`;
        g.fillRect(x, y, 40 + (i % 5) * 10, 40);
      }
      g.fillStyle = "#fff";
      g.font = "bold 40px sans-serif";
      g.fillText("FRAME " + frame, 60, 760);
      stampTime(g, 1080);
      requestAnimationFrame(draw);
    }
    draw();

    // Tono de prueba por la salida de audio (la "toma" lo manda a la tele).
    window.startTone = () => {
      if (window.__tone) return window.__tone.state;
      const ctx = window.__tone = new AudioContext();
      const o = ctx.createOscillator();
      const gain = ctx.createGain();
      gain.gain.value = 0.3;
      o.frequency.value = 440;
      o.connect(gain);
      gain.connect(ctx.destination);
      o.start();
      return ctx.state;
    };

    const status = [];
    const say = msg => {
      status.push(msg);
      document.getElementById("out").textContent = status.slice(-6).join("\n");
    };
    window.labPeer = { connections: {} };
    window.labStatus = status;
    window.labKeys = [];
    if (qp.get("native")) {
      // Modo nativo: los mensajes van y vienen por el laboratorio (tvlab.mjs), que
      // hace de sesión de Chromecast entre las dos páginas.
      const listeners = [];
      window.labNativeFromTv = m => listeners.forEach(l => l(m));
      const transport = { send: m => window.labToTv(m), onMessage: cb => listeners.push(cb) };
      window.startTone();
      setTimeout(async () => {
        window.labStream = await startNative(transport, {
          getCanvas: () => c, getAudioTrack: qp.get("noaudio") ? () => null : getAudioTrack, onStatus: say, onTvKeys: k => window.labKeys.push(k),
          width: +qp.get("w") || 960, height: +qp.get("h") || 720, fps: +qp.get("fps") || 30,
          audioLeadMs: qp.get("lead") != null ? +qp.get("lead") : undefined,
        });
        if (!window.labStream) say("sin modo nativo");
      }, 300);
    }
    const peer = qp.get("native") ? null : new Peer(PEER_PREFIX + "lab-" + randomCode(), { debug: 1 });
    if (peer) peer.on("open", () => {
      window.labStream = streamTo(peer, tvCode, () => c, peer.id, say, qp.get("q") || "auto", { onTvKeys: k => window.labKeys.push(k) });
    });
    if (peer) window.labPeer = peer;
  </script>
</body>
</html>
