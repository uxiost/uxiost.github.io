<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Pantalla — MGS Web</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <style>
    [hidden] { display: none !important; }
    html, body { background: #000; height: 100%; overflow: hidden; }
    #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
    #wait {
      position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center;
      padding: 5vh 5vw;
    }
    #wait .code { font-size: clamp(3rem, 12vw, 9rem); letter-spacing: .2em; line-height: 1; }
    #wait p { font-size: clamp(1rem, 2.2vw, 1.6rem); margin: 0; }
    #sound {
      position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%);
      font-size: clamp(1rem, 2.4vw, 1.8rem); padding: .7em 1.3em; z-index: 5;
    }
    #stat { position: fixed; right: 12px; bottom: 10px; font: 12px ui-monospace, monospace; color: #6a7d66; z-index: 4; }
  </style>
</head>
<body>
  <video id="video" playsinline autoplay></video>
  <div id="wait">
    <h1 class="brand" style="margin:0">PANTALLA <span style="color:var(--accent)">TV</span></h1>
    <p class="muted" id="howto">En el móvil, abre <b>uxiost.github.io/mgs/play.html</b> → <b>Ver en la tele</b> y escribe:</p>
    <div class="code" id="code">·····</div>
    <p class="muted" id="state">Preparando…</p>
    <p class="muted small">El juego corre en el móvil; esta pantalla solo muestra la imagen. Puedes jugar con un mando Bluetooth emparejado con la tele o con los botones de colores del mando de la tele.</p>
  </div>
  <button id="sound" class="primary" hidden>🔊 Pulsa OK para activar el sonido</button>
  <div id="stat"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <script type="module">
    // La tele no se recarga sola al publicar cambios: cargamos los módulos con la
    // versión actual (evita cachés viejas) y comprobamos cada minuto si hay otra.
    const version = await fetch("version.json", { cache: "no-store" }).then(r => r.json()).then(j => j.v).catch(() => 0);
    const q = "?v=" + version;
    const { BUTTONS, randomCode } = await import("./js/protocol.js" + q);
    const { TV_PREFIX, lowLatencyReceivers, boostBitrate } = await import("./js/stream.js" + q);
    const { remember, report, selfTest } = await import("./js/diag.js" + q);
    setInterval(async () => {
      const v = await fetch("version.json", { cache: "no-store" }).then(r => r.json()).then(j => j.v).catch(() => version);
      if (v !== version) location.reload();
    }, 60000);

    // Un candidato de red que este motor no entiende (p. ej. direcciones .local de
    // Android) no debe tumbar la conexión: lo anotamos y seguimos con los demás.
    if (window.RTCPeerConnection) {
      const addIce = RTCPeerConnection.prototype.addIceCandidate;
      RTCPeerConnection.prototype.addIceCandidate = function (...args) {
        return Promise.resolve(addIce.apply(this, args)).catch(err => {
          remember("addIceCandidate ignorado", err, args[0] && args[0].candidate);
        });
      };
    } else {
      report("tv", "no-webrtc", { ua: navigator.userAgent });
    }

    const $ = s => document.querySelector(s);
    const video = $("#video");
    // El código puede venir en la dirección (#abcde) cuando la abre el móvil vía Chromecast.
    const fromPhone = location.hash.length > 1; // abierta por el móvil vía Chromecast
    const code = (location.hash.slice(1) || randomCode()).toLowerCase();
    $("#code").textContent = code.toUpperCase();
    if (fromPhone) {
      $("#howto").textContent = "Abierta desde tu móvil: se conecta solo, no hace falta escribir nada.";
      $("#code").style.fontSize = "clamp(1.5rem, 4vw, 3rem)";
    }

    let peer, ctrl = null, mask = 0, lastSent = 0, currentCall = null;
    // En el Chromecast el audio de WebRTC no sale por el reproductor de vídeo:
    // lo sacamos por Web Audio, que usa otra ruta de salida.
    const isCast = /CrKey/.test(navigator.userAgent);
    let audioCtx = null, audioSrc = null, audioTrackId = "";

    function start() {
      peer = new Peer(TV_PREFIX + code, { debug: 3, logFunction: (lvl, ...a) => remember(...a) });
      peer.on("open", () => { $("#state").textContent = "Esperando al móvil…"; });
      peer.on("disconnected", () => setTimeout(() => !peer.destroyed && peer.reconnect(), 1500));
      peer.on("error", e => {
        $("#state").textContent = `Error de conexión (${e.type}: ${e.message || ""}). Reintentando…`;
        report("tv", "peer-error", { code, type: e.type, msg: String(e.message || e) });
        if (e.type === "unavailable-id") { peer.destroy(); setTimeout(start, 3000); }
      });
      peer.on("call", call => {
        // Una sola llamada a la vez: si el móvil reconecta, la anterior se cuelga
        // (dos vídeos a la vez ahogan el procesador de la tele).
        if (currentCall && currentCall !== call) { try { currentCall.close(); } catch (e) {} }
        currentCall = call;
        call.answer(undefined, { sdpTransform: boostBitrate });
        report("tv", "call", { code });
        call.peerConnection && (call.peerConnection.onconnectionstatechange = () =>
          report("tv", "pc-state", { code, st: call.peerConnection.connectionState }));
        call.on("stream", s => { if (call === currentCall) show(s, call); });
        call.on("close", () => {
          if (call !== currentCall) return;
          $("#wait").hidden = false;
          $("#state").textContent = "El móvil se ha desconectado. Esperando…";
        });
        // Canal de vuelta: el mando de la tele llega al móvil como un mando más.
        // (El Chromecast de las LG no tiene canales de datos: ahí no hay canal de vuelta
        // y se juega con el móvil o con un mando emparejado al móvil.)
        const consoleId = call.metadata && call.metadata.console;
        dataChannelsWork.then(ok => {
          if (ok && consoleId && (!ctrl || !ctrl.open)) connectCtrl(consoleId);
        });
      });
    }

    const dataChannelsWork = (async () => {
      try {
        const pc = new RTCPeerConnection();
        pc.createDataChannel("t");
        await pc.setLocalDescription(await pc.createOffer());
        pc.close();
        return true;
      } catch (e) {
        return false;
      }
    })();

    // Fotogramas que de verdad se pintan en pantalla (no solo los recibidos) y
    // cuánto se atasca la página: así sabemos si la tele va sobrepasada.
    let presented = 0;
    const countFrames = () => { presented++; video.requestVideoFrameCallback(countFrames); };
    if ("requestVideoFrameCallback" in HTMLVideoElement.prototype) video.requestVideoFrameCallback(countFrames);
    let lagMax = 0, lagLast = performance.now();
    setInterval(() => { const now = performance.now(); lagMax = Math.max(lagMax, now - lagLast - 100); lagLast = now; }, 100);
    async function presentedFps() {
      const a = presented; await new Promise(r => setTimeout(r, 2000));
      return Math.round((presented - a) / 2 * 10) / 10;
    }

    let statsSent = false;
    function show(stream, call) {
      // "stream" llega una vez por pista (audio y vídeo): no recargar si es el mismo.
      if (video.srcObject !== stream) video.srcObject = stream;
      lowLatencyReceivers(call.peerConnection);
      $("#wait").hidden = true;
      if (isCast) routeAudioWebAudio(stream);
      // El reproductor debe seguir "sonando" para que el audio de WebRTC fluya hacia
      // Web Audio: sin silenciar, pero a volumen 0 cuando el sonido sale por Web Audio.
      video.muted = false;
      video.volume = isCast && audioSrc ? 0 : 1;
      video.play().catch(err => {
        if (err && err.name === "AbortError") return; // otra carga en curso; no es un bloqueo
        // Sin interacción previa algunas teles no dejan sonar el audio.
        report("tv", "autoplay-blocked", { code, err: String(err) });
        video.muted = true;
        video.play().catch(() => {});
        $("#sound").hidden = false;
        $("#sound").focus();
      });
      if (!show.reported) {
        show.reported = true;
        setTimeout(() => reportAV(currentCall, "av-15s"), 15000);
        setTimeout(() => reportAV(currentCall, "av-60s"), 60000);
      }
    }

    function routeAudioWebAudio(stream) {
      const track = stream.getAudioTracks()[0];
      if (!track || track.id === audioTrackId) return;
      try {
        audioCtx = audioCtx || new AudioContext({ latencyHint: "interactive" });
        if (audioSrc) audioSrc.disconnect();
        audioSrc = audioCtx.createMediaStreamSource(new MediaStream([track]));
        audioSrc.connect(audioCtx.destination);
        audioTrackId = track.id;
        window.__mgsAudio = { ctx: audioCtx, src: audioSrc }; // para depurar
        audioCtx.resume().catch(() => {});
        // Si Web Audio no arranca, volvemos al audio del reproductor de vídeo.
        setTimeout(() => {
          if (audioCtx.state !== "running") { video.volume = 1; report("tv", "webaudio-not-running", { code, st: audioCtx.state }); }
        }, 2000);
      } catch (e) {
        audioSrc = null;
        report("tv", "webaudio-error", { code, msg: String(e) });
      }
    }

    // Informe de audio y vídeo a los 10 s: ¿llega audio con energía? ¿se congela la imagen?
    // Pico de señal que de verdad entra en Web Audio durante 1 s.
    async function webAudioPeak() {
      if (!audioCtx || !audioSrc) return null;
      const an = audioCtx.createAnalyser();
      an.fftSize = 2048;
      audioSrc.connect(an);
      const buf = new Float32Array(2048);
      let peak = 0;
      for (let i = 0; i < 10; i++) {
        await new Promise(r => setTimeout(r, 100));
        an.getFloatTimeDomainData(buf);
        for (const x of buf) peak = Math.max(peak, Math.abs(x));
      }
      audioSrc.disconnect(an);
      return Math.round(peak * 1000) / 1000;
    }

    async function reportAV(call, stage) {
      const pc = call && call.peerConnection;
      if (!pc) return;
      lagMax = 0;
      const out = { code, version, isCast, ctx: audioCtx && audioCtx.state, videoMuted: video.muted, vol: video.volume, paused: video.paused, waPeak: await webAudioPeak(), shownFps: await presentedFps() };
      out.lagMaxMs = Math.round(lagMax);
      (await pc.getStats()).forEach(r => {
        if (r.type !== "inbound-rtp") return;
        if (r.kind === "audio") Object.assign(out, { aPkts: r.packetsReceived, aLost: r.packetsLost, aEnergy: r.totalAudioEnergy, aLevel: r.audioLevel, aConcealed: r.concealedSamples, aSamples: r.totalSamplesReceived });
        if (r.kind === "video") Object.assign(out, { vW: r.frameWidth, vH: r.frameHeight, fps: r.framesPerSecond, dec: r.framesDecoded, drop: r.framesDropped, freezes: r.freezeCount, freezeS: r.totalFreezesDuration, lost: r.packetsLost, decMs: r.framesDecoded ? Math.round(1000 * r.totalDecodeTime / r.framesDecoded) : null });
      });
      report("tv", stage, out);
    }

    $("#sound").onclick = () => { video.muted = false; video.play(); $("#sound").hidden = true; };

    function connectCtrl(id) {
      ctrl = peer.connect(id, { serialization: "json", reliable: true, metadata: { tv: true } });
      ctrl.on("close", () => { ctrl = null; });
      ctrl.on("error", () => { ctrl = null; });
    }

    // ---- entrada desde la tele: mando Bluetooth (API Gamepad, mapeo estándar) y mando de la tele
    const PAD_MAP = { 0: "cross", 1: "circle", 2: "square", 3: "triangle", 4: "l1", 5: "r1", 6: "l2", 7: "r2",
      8: "select", 9: "start", 10: "l3", 11: "r3", 12: "up", 13: "down", 14: "left", 15: "right" };
    // Mando de LG: flechas, OK = ✕, colores: rojo ○, verde △, amarillo □, azul START.
    const KEY_MAP = { 37: "left", 38: "up", 39: "right", 40: "down", 13: "cross",
      403: "circle", 404: "triangle", 405: "square", 406: "start" };
    const keys = new Set();

    window.addEventListener("keydown", e => {
      if (!$("#sound").hidden && e.keyCode === 13) return; // OK activa el sonido
      const b = KEY_MAP[e.keyCode];
      if (b) { keys.add(b); e.preventDefault(); }
    });
    window.addEventListener("keyup", e => { const b = KEY_MAP[e.keyCode]; if (b) keys.delete(b); });

    function poll() {
      const pressed = new Set(keys);
      for (const gp of navigator.getGamepads ? navigator.getGamepads() : []) {
        if (!gp) continue;
        gp.buttons.forEach((b, i) => { if (b.pressed && PAD_MAP[i]) pressed.add(PAD_MAP[i]); });
        // Stick izquierdo como cruceta (MGS1 se juega con cruceta).
        const [x = 0, y = 0] = gp.axes;
        if (x < -0.5) pressed.add("left");
        if (x > 0.5) pressed.add("right");
        if (y < -0.5) pressed.add("up");
        if (y > 0.5) pressed.add("down");
      }
      let m = 0;
      for (const n of pressed) m |= 1 << BUTTONS[n];
      if (ctrl && ctrl.open && (m !== mask || Date.now() - lastSent > 250)) {
        ctrl.send({ t: "s", b: m });
        mask = m;
        lastSent = Date.now();
      }
      requestAnimationFrame(poll);
    }
    poll();

    // Estadísticas pequeñas para ver el retraso real.
    setInterval(async () => {
      const pc = currentCall && currentCall.peerConnection;
      if (!pc) return;
      const stats = await pc.getStats();
      stats.forEach(r => {
        if (r.type === "inbound-rtp" && r.kind === "video") {
          const fps = r.framesPerSecond ? Math.round(r.framesPerSecond) : "?";
          const jb = r.jitterBufferEmittedCount ? Math.round(1000 * r.jitterBufferDelay / r.jitterBufferEmittedCount) : "?";
          $("#stat").textContent = `v${version} · ${r.frameWidth || "?"}×${r.frameHeight || "?"} · ${fps} fps · búfer ${jb} ms`;
          if (!statsSent && r.framesDecoded > 300) {
            statsSent = true;
            report("tv", "stats", { code, w: r.frameWidth, h: r.frameHeight, fps, jb, dropped: r.framesDropped, decoded: r.framesDecoded, dec: r.decoderImplementation, codec: r.codecId });
          }
        }
      });
    }, 2000);

    start();

    // Autodiagnóstico al abrir: ¿funciona WebRTC dentro de esta tele?
    selfTest().then(r => {
      report("tv", "selftest", { code, ...r });
      $("#stat").textContent = `datos: ${String(r.loopData).slice(0, 40)} · vídeo: ${String(r.loopVideo).slice(0, 40)}`;
    });
    window.addEventListener("error", e => report("tv", "js-error", { msg: e.message }));
  </script>
</body>
</html>
